<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda di Noemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2130;--mute:#6b7080;--line:#e6e2d8;--acc:#5b5bd6;--acc2:#ecebfd;--ok:#2f9e6b;--ok2:#e3f5ec;--warn:#d9712b;--warn2:#fdeee3;--bad:#d64545;--bad2:#fbe6e6;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#13141a;--card:#1d1f28;--ink:#eceef4;--mute:#9aa0b0;--line:#2c2f3b;--acc:#8d8df6;--acc2:#2a2a48;--ok2:#17352a;--warn2:#3a2717;--bad2:#3a1c1c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 18px 8px;display:flex;align-items:center;gap:10px}
header .ttl{flex:1;font-weight:700;font-size:18px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.pill.timer{background:var(--acc);color:#fff;border-color:var(--acc)}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
main{padding:0 16px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{font-size:26px;margin:2px 0 4px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:13px;color:var(--mute);font-weight:500}
.empty{color:var(--mute);font-size:15px;text-align:center;padding:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button .i{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc);font-weight:600}
nav button.on .i{filter:none;opacity:1}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border-radius:99px;background:var(--bg)}
.lesson{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px}
.lesson .t{width:44px;color:var(--mute);font-size:13px}
.lesson.now{background:var(--acc2);font-weight:600}
.lesson.now .t{color:var(--acc)}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:var(--r);padding:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin:12px 0}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--acc2);color:var(--acc)}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,#999);border-radius:16px;padding:14px;margin:10px 0}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .title{font-size:17px;font-weight:600;margin:6px 0 4px}
.item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item.done{opacity:.55}
.item.done .title{text-decoration:line-through}
.due{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mute);margin-left:auto}
.due.soon{background:var(--warn2);color:var(--warn)}
.due.late{background:var(--bad2);color:var(--bad)}
.due.ok{background:var(--ok2);color:var(--ok)}
.chk{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;border-radius:10px;user-select:none}
.chk .b{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:#fff;transition:.15s}
.chk.on .b{background:var(--ok);border-color:var(--ok)}
.chk.on .l{color:var(--mute);text-decoration:line-through}
.chk .s{margin-left:auto;font-size:12px;color:var(--mute)}
.grp{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 2px}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.count{font-size:34px;font-weight:700;line-height:1;color:var(--c)}
.test-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.test-row:first-of-type{border-top:0}
table.tt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.tt th{font-size:12px;color:var(--mute);font-weight:600}
.tt td{height:46px;border-radius:10px;background:var(--bg);text-align:center;font-size:11px;font-weight:600;cursor:pointer;padding:2px;overflow:hidden;word-break:break-word}
.tt td.h{background:none;color:var(--mute);font-weight:500;width:42px}
.tt td.f{color:#fff}
.tt th.today{color:var(--acc)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.srow:first-of-type{border-top:0}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bg) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px}
.hero{display:flex;align-items:center;gap:14px}
.tip{background:var(--acc2);color:var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.alert{background:var(--warn2);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;margin:12px 0}
#modal{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 12px;font-size:20px}
#modal label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
#modal input,#modal select,#modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
#modal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal .row input{flex:1;min-width:150px}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.mrow .btn{flex:1}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.timer-face{width:230px;height:230px;margin:10px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bg) 0)}
.timer-face div{width:196px;height:196px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.timer-face b{font-size:46px;font-variant-numeric:tabular-nums}
.center{text-align:center}
.fx{position:fixed;z-index:50;pointer-events:none;font-size:26px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="ttl" id="hdr">Agenda</div>
  <span class="pill timer" id="tpill" data-act="timer" style="display:none"></span>
  <span class="pill" id="stars" data-act="starsinfo">⭐ 0</span>
  <button class="icon-btn" data-act="settings" aria-label="Impostazioni">⚙️</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== Dati importati (es. da Nuvola): Claude aggiorna questo blocco ===== */
const SEED = {rev:0, slots:null, timetable:null, homework:[], tests:[]};

const KEY='agenda-noemi-v1';
const DAYS=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const DSH=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const COLORS=['#e5484d','#f76b15','#e2a31a','#46a758','#12a594','#0090ff','#3e63dd','#6e56cf','#8e4ec6','#d6409f','#978365','#64748b'];

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(a,id)=>a.find(x=>x.id===id);

function defaults(){
  const S=(id,name,color,items)=>({id,name,color,items});
  return {
    name:'Noemi', days:5,
    slots:['8:00','9:00','10:00','11:00','12:00','13:00'],
    subjects:[
      S('ita','Italiano','#e5484d',['Libro di antologia','Libro di grammatica','Quaderno di italiano']),
      S('sto','Storia','#f76b15',['Libro di storia','Quaderno di storia']),
      S('geo','Geografia','#e2a31a',['Libro di geografia','Atlante']),
      S('mat','Matematica','#0090ff',['Libro di matematica','Quaderno a quadretti','Righello, squadra, compasso']),
      S('sci','Scienze','#46a758',['Libro di scienze','Quaderno di scienze']),
      S('ing','Inglese','#3e63dd',['Libro di inglese','Workbook','Quaderno di inglese']),
      S('l2','Seconda lingua','#6e56cf',['Libro','Quaderno']),
      S('tec','Tecnologia','#64748b',['Album e matite da disegno tecnico','Libro di tecnologia']),
      S('art','Arte','#d6409f',['Album da disegno','Colori']),
      S('mus','Musica','#8e4ec6',['Libro di musica','Strumento']),
      S('mot','Ed. fisica','#12a594',['Tuta e scarpe da ginnastica','Asciugamano e deodorante']),
      S('rel','Religione','#978365',['Libro di religione'])
    ],
    timetable:{1:[],2:[],3:[],4:[],5:[],6:[]},
    homework:[], tests:[], grades:[],
    fixed:['Diario','Astuccio completo','Borraccia piena','Merenda','Chiavi di casa'],
    evening:['Ho controllato Nuvola per domani','Vestiti pronti sulla sedia','Telefono/tablet in carica','Sveglia puntata'],
    checks:{}, stars:0, seedRev:0
  };
}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  s=Object.assign(defaults(),s||{});
  applySeed(s,SEED);
  return s;
}
function applySeed(s,seed){
  if(!seed||!(seed.rev>(s.seedRev||0)))return;
  if(seed.slots)s.slots=seed.slots;
  if(seed.timetable)s.timetable=Object.assign(s.timetable,seed.timetable);
  if(seed.subjects)seed.subjects.forEach(n=>{const o=byId(s.subjects,n.id);o?Object.assign(o,n):s.subjects.push(n)});
  (seed.homework||[]).forEach(h=>{if(!byId(s.homework,h.id))s.homework.push(Object.assign({steps:[],done:false},h))});
  (seed.tests||[]).forEach(t=>{if(!byId(s.tests,t.id))s.tests.push(Object.assign({steps:[],kind:'Scritta',topics:''},t))});
  (seed.grades||[]).forEach(g=>{if(!byId(s.grades,g.id)){const v=parseGrade(g.label);if(v!=null)s.grades.push(Object.assign({kind:'Scritto',note:''},g,{value:v}))}});
  s.seedRev=seed.rev;
}
/* voti all'italiana: 7+ = 7,25 · 7- = 6,75 · 7½ = 7,5 · 6/7 = 6,5 */
function parseGrade(str){
  let s=String(str??'').trim().replace(',', '.').replace('½','.5').replace(/\s+/g,'');
  let m=s.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(m){const a=+m[1],b=+m[2];if(b===a+1&&b<=10)return a+.5}
  m=s.match(/^(\d{1,2}(?:\.\d+)?)([+-]{0,2})$/);
  if(!m)return null;
  let v=+m[1];const mod=m[2];
  if(mod==='+')v+=.25;else if(mod==='-')v-=.25;else if(mod==='++')v+=.5;else if(mod==='--')v-=.5;
  return v>=0&&v<=10?v:null;
}
const fmt=v=>(Math.round(v*100)/100).toLocaleString('it-IT',{maximumFractionDigits:2});
const gCol=v=>v>=6?'var(--ok)':v>=5?'var(--warn)':'var(--bad)';
const gBg=v=>v>=6?'var(--ok2)':v>=5?'var(--warn2)':'var(--bad2)';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== date ===== */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const isSchool=d=>{const w=d.getDay();return w>=1&&w<=S.days};
function nextSchool(d){let x=addDays(d,1);for(let i=0;i<8&&!isSchool(x);i++)x=addDays(x,1);return x}
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const longDate=d=>`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
function rel(ds){
  const n=diff(ds,iso(today()));
  if(n<-1)return `${-n} giorni fa`; if(n===-1)return 'ieri';
  if(n===0)return 'oggi'; if(n===1)return 'domani';
  if(n<7)return DAYS[parse(ds).getDay()].toLowerCase();
  return `tra ${n} giorni`;
}
const subj=id=>byId(S.subjects,id)||{name:'Altro',color:'#94a3b8',items:[]};
const lessonsOn=d=>(S.timetable[d.getDay()]||[]);
const subjectsOn=d=>[...new Set(lessonsOn(d).filter(Boolean))];
function nextLesson(sid){let x=today();for(let i=0;i<15;i++){x=addDays(x,1);if(isSchool(x)&&subjectsOn(x).includes(sid))return iso(x)}return null}
const tag=s=>`<span class="tag"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`;
const chk=(on,label,act,data,side='')=>`<div class="chk ${on?'on':''}" data-act="${act}" ${data}><span class="b">${on?'✓':''}</span><span class="l">${label}</span>${side?`<span class="s">${side}</span>`:''}</div>`;

/* ===== UI ===== */
let TAB='oggi', F={hwDone:false};
const TABS=[['oggi','🏠','Oggi'],['compiti','📝','Compiti'],['verifiche','🎯','Verifiche'],['voti','📊','Voti'],['orario','🗓️','Orario'],['sera','🎒','Zaino']];

function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${TAB===k?'on':''}" data-act="tab" data-t="${k}"><span class="i">${i}</span>${l}</button>`).join('');
  document.getElementById('hdr').textContent=TABS.find(t=>t[0]===TAB)[2]==='Oggi'?'Agenda':TABS.find(t=>t[0]===TAB)[2];
  document.getElementById('stars').textContent='⭐ '+S.stars;
  const V={oggi:vOggi,compiti:vCompiti,verifiche:vVerifiche,voti:vVoti,orario:vOrario,sera:vSera};
  document.getElementById('app').innerHTML=V[TAB]();
}

function nowSlot(){
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  const mins=S.slots.map(s=>{const[h,mm]=s.split(':').map(Number);return h*60+(mm||0)});
  for(let i=0;i<mins.length;i++){const end=mins[i+1]??mins[i]+60;if(m>=mins[i]&&m<end)return i}
  return -1;
}

function vOggi(){
  const t=today(),tI=iso(t),tom=nextSchool(t),tomI=iso(tom);
  let h=`<div class="sub" style="margin-top:4px">${longDate(new Date())}</div><h1>Ciao ${esc(S.name)} 👋</h1>`;
  const late=S.homework.filter(x=>!x.done&&x.due<tI);
  if(late.length)h+=`<div class="alert">⚠️ ${late.length===1?'C’è 1 compito':'Ci sono '+late.length+' compiti'} rimasto indietro. Uno alla volta, ce la fai!</div>`;

  // a scuola oggi
  const L=lessonsOn(t), ns=nowSlot();
  if(isSchool(t)&&L.some(Boolean)){
    h+=`<div class="card"><h2>🏫 Oggi a scuola</h2>`+S.slots.map((s,i)=>L[i]?`<div class="lesson ${i===ns?'now':''}"><span class="t">${s}</span><span class="dot" style="background:${subj(L[i]).color}"></span>${esc(subj(L[i]).name)}${i===ns?' <span class="sub" style="margin-left:auto">adesso</span>':''}</div>`:'').join('')+`</div>`;
  }else if(!isSchool(t)){
    h+=`<div class="card"><h2>🌤️ Oggi niente scuola</h2><div class="sub">Goditi la giornata. Se ci sono compiti, meglio farne un pezzetto presto.</div></div>`;
  }else{
    h+=`<div class="card"><h2>🏫 Oggi a scuola</h2><div class="empty">Inserisci l’orario nella sezione <b>Orario</b></div></div>`;
  }

  // ripasso di oggi
  const rip=[];S.tests.forEach(x=>x.steps.forEach((st,i)=>{if(st.date===tI)rip.push([x,st,i])}));
  if(rip.length)h+=`<div class="card"><h2>🧠 Ripasso di oggi</h2>`+rip.map(([x,st,i])=>chk(st.done,`${esc(subj(x.subj).name)}: ${esc(st.t)}`,'step',`data-k="t" data-id="${x.id}" data-i="${i}"`)).join('')+`</div>`;

  // per domani
  const hw=S.homework.filter(x=>x.due===tomI), d=hw.filter(x=>x.done).length;
  h+=`<div class="card"><h2>📝 Compiti per ${tomI===iso(addDays(t,1))?'domani':DAYS[tom.getDay()].toLowerCase()}<span class="r">${d}/${hw.length}</span></h2>`;
  h+=hw.length?hw.map(x=>chk(x.done,`${esc(subj(x.subj).name)} · ${esc(x.title)}`,'hwdone',`data-id="${x.id}"`)).join('')+`<div class="bar"><i style="width:${hw.length?d/hw.length*100:0}%"></i></div>`:`<div class="empty">Nessun compito segnato 🎉</div>`;
  h+=`</div>`;
  h+=`<button class="big-btn" data-act="timer">⏱️ Inizia a concentrarti</button>`;

  // verifiche
  const ts=S.tests.filter(x=>x.date>=tI).sort((a,b)=>a.date<b.date?-1:1).slice(0,4);
  h+=`<div class="card"><h2>🎯 Verifiche in arrivo</h2>`+(ts.length?ts.map(x=>{const s=subj(x.subj),n=diff(x.date,tI);return `<div class="test-row" data-act="tab" data-t="verifiche" style="cursor:pointer"><div class="count" style="--c:${s.color};width:46px;text-align:center">${n}</div><div><b>${esc(s.name)}</b> · ${esc(x.kind)}<div class="sub">${n===0?'OGGI':n===1?'domani':'giorni · '+longDate(parse(x.date))}</div></div></div>`}).join(''):`<div class="empty">Nessuna verifica in vista</div>`)+`</div>`;

  // zaino
  const z=zainoStats();

function dueCls(ds){const n=diff(ds,iso(today()));return n<0?'late':n<=1?'soon':''}

function vCompiti(){
  const list=S.homework.filter(h=>F.hwDone?h.done:!h.done).sort((a,b)=>F.hwDone?(a.due<b.due?1:-1):(a.due<b.due?-1:1));

  if(!list.length)return h+`<div class="card empty">${F.hwDone?'Ancora niente qui':'Tutto fatto! 🎉'}</div>`;
  let last='';
  list.slice(0,F.hwDone?40:999).forEach(x=>{
    const g=F.hwDone?'':(x.due<iso(today())?'In ritardo':'Per '+rel(x.due)+(diff(x.due,iso(today()))>1&&diff(x.due,iso(today()))<7?'':'')+' · '+parse(x.due).getDate()+' '+MONTHS[parse(x.due).getMonth()]);

function periods(){
  const t=today(),y=t.getMonth()>=8?t.getFullYear():t.getFullYear()-1;
  return {p1:[`${y}-09-01`,`${y+1}-01-31`],p2:[`${y+1}-02-01`,`${y+1}-08-31`],all:[`${y}-09-01`,`${y+1}-08-31`],cur:iso(t)>=`${y+1}-02-01`?'p2':'p1'};
}
function gradesIn(per){const P=periods()[per];return S.grades.filter(g=>g.date>=P[0]&&g.date<=P[1])}

function zaino(){
  const tom=nextSchool(today()),tI=iso(tom);
  const books=[];const seen=new Set();
  subjectsOn(tom).forEach(id=>subj(id).items.forEach(it=>{const k=id+'|'+it;if(!seen.has(k)){seen.add(k);books.push({key:'b:'+k,label:it,side:subj(id).name})}}));
  const fixed=S.fixed.map(it=>({key:'f:'+it,label:it}));
  const hw=S.homework.filter(h=>h.due===tI);
  const tests=S.tests.filter(x=>x.date===tI).map(x=>({key:'v:'+x.id,label:`Ho ripassato per ${x.kind.toLowerCase()} di ${subj(x.subj).name}`}));
  const eve=S.evening.map(it=>({key:'e:'+it,label:it}));
  return {tom,tI,books,fixed,hw,tests,eve};
}
function zainoStats(){
  const z=zaino(),c=S.checks[z.tI]||{};
  const keys=[...z.books,...z.fixed,...z.tests,...z.eve].map(x=>x.key);
  const total=keys.length+z.hw.length, done=keys.filter(k=>c[k]).length+z.hw.filter(h=>h.done).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function vSera(){
  const z=zaino(),c=S.checks[z.tI]||{},st=zainoStats();
  const row=x=>chk(!!c[x.key],esc(x.label),'zk',`data-k="${esc(x.key)}"`,x.side?esc(x.side):'');
  let h=`<div class="card"><div class="hero"><div class="ring" style="--p:${st.pct}"><b>${st.pct}%</b></div><div><b style="font-size:18px">Per ${longDate(z.tom).toLowerCase()}</b><div class="sub">${st.pct===100?'Zaino pronto! Ora puoi rilassarti 🌙':'Spunta una cosa alla volta mentre la metti nello zaino'}</div></div></div></div>`;
  const subs=subjectsOn(z.tom);
  h+=`<div class="card"><h2>📚 Libri e quaderni</h2>${subs.length?`<div class="picks" style="margin-bottom:6px">${subs.map(id=>tag(subj(id))).join('')}</div>`+z.books.map(row).join(''):`<div class="empty">Inserisci l’orario per vedere cosa portare</div>`}</div>`;
  h+=`<div class="card"><h2>✏️ Ogni giorno</h2>${z.fixed.map(row).join('')}</div>`;
  if(z.hw.length||z.tests.length)h+=`<div class="card"><h2>📝 Compiti e verifiche di domani</h2>${z.hw.map(x=>chk(x.done,`${esc(subj(x.subj).name)} · ${esc(x.title)}`,'hwdone',`data-id="${x.id}"`)).join('')}${z.tests.map(row).join('')}</div>`;
  h+=`<div class="card"><h2>🌙 Prima di dormire</h2>${z.eve.map(row).join('')}</div>`;
  h+=`<button class="btn ghost" style="width:100%" data-act="lists">✎ Modifica le liste fisse</button>`;
  return h;
}

const TIMER={total:15*60,left:15*60,run:false,iv:null,label:'',open:false};

  if(label&&!TIMER.run)TIMER.label=label;

  ${TIMER.label?`<div class="center sub">${esc(TIMER.label)}</div>`:''}
  <div class="timer-face" style="--p:${p}"><div><div><b>${m}:${String(s).padStart(2,'0')}</b><div class="sub">${TIMER.run?'sto lavorando…':'pronta?'}</div></div></div></div>
  ${TIMER.run?'':`<div class="picks" style="justify-content:center;margin-bottom:14px">${[5,10,15,25].map(n=>`<button class="chip ${TIMER.total===n*60?'on':''}" data-act="tset" data-n="${n}">${n} min</button>`).join('')}</div>`}
  <div class="mrow"><button class="btn ghost" data-act="tstop">Stop</button><button class="btn" data-act="tgo">${TIMER.run?'⏸ Pausa':'▶︎ Via!'}</button></div>
  <div class="tip">📵 Telefono lontano, un compito solo, acqua vicino. Quando suona: 5 minuti di pausa vera.</div>`);

    clearInterval(TIMER.iv);TIMER.run=false;TIMER.left=TIMER.total;S.stars+=1;save();beep();celebrate();
    toast('Fatto! ⭐ +1 — ora 5 minuti di pausa: alzati e bevi un po’ d’acqua');
  }
  pill();
  if(TIMER.open&&M.classList.contains('open'))timerModal();
  if(!M.classList.contains('open'))TIMER.open=false;
  render();
}
function pill(){const p=document.getElementById('tpill');if(TIMER.run){p.style.display='';p.textContent='⏱ '+Math.floor(TIMER.left/60)+':'+String(TIMER.left%60).padStart(2,'0')}else p.style.display='none'}
let AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=660+t*400;g.gain.setValueAtTime(.2,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.22);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.25)})}catch(e){}}

/* ===== effetti ===== */
function celebrate(){const e=['⭐','✨','🎉','💜','🌟'];for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fx';s.textContent=e[i%e.length];s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*-300-40)+'px');s.style.setProperty('--rot',(Math.random()*360)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

/* ===== azioni ===== */
const ACT={
  tab:el=>{TAB=el.dataset.t;render();scrollTo(0,0)},
  hwf:el=>{F.hwDone=el.dataset.v==='1';render()},
  hwnew:()=>hwForm(),
  hwedit:el=>hwForm(byId(S.homework,el.dataset.id)),
  hwdone:el=>{const x=byId(S.homework,el.dataset.id);x.done=!x.done;if(x.done){S.stars++;x.steps.forEach(s=>s.done=true);celebrate()}save();render();checkZaino()},
  step:el=>{const arr=el.dataset.k==='t'?S.tests:S.homework,x=byId(arr,el.dataset.id),st=x.steps[+el.dataset.i];st.done=!st.done;
    if(el.dataset.k==='h'&&x.steps.every(s=>s.done)&&!x.done){x.done=true;S.stars++;celebrate()}
    else if(st.done&&el.dataset.k==='t'){S.stars++;celebrate()}
    save();render()},
  qdue:el=>{const sid=val('f-subj');const v=el.dataset.v==='tom'?iso(nextSchool(today())):(nextLesson(sid)||iso(nextSchool(today())));document.getElementById('f-due').value=v;if(el.dataset.v==='next'&&!nextLesson(sid))toast('Inserisci l’orario per usare “prossima lezione”')},
  hwsave:el=>{const title=val('f-title');if(!title){toast('Scrivi cosa devi fare');return}
    let x=byId(S.homework,el.dataset.id);const old=x?x.steps:[];
    const steps=lines(document.getElementById('f-steps').value).map(t=>({t,done:!!(old.find(o=>o.t===t)||{}).done}));
    if(!x){x={id:el.dataset.id,done:false};S.homework.push(x)}
    Object.assign(x,{subj:val('f-subj'),title,due:val('f-due')||iso(nextSchool(today())),steps});save();closeModal();render()},
  hwdel:el=>{if(!armed(el))return;S.homework=S.homework.filter(x=>x.id!==el.dataset.id);save();closeModal();render()},
  tnew:()=>testForm(),
  tedit:el=>testForm(byId(S.tests,el.dataset.id)),
  tog:el=>{el.classList.toggle('on');el.querySelector('.b').textContent=el.classList.contains('on')?'✓':''},
  tsave:el=>{const date=val('t-date');if(!date){toast('Scegli la data');return}
    let x=byId(S.tests,el.dataset.id);const isNew=!x;
    if(!x){x={id:el.dataset.id,steps:[]};S.tests.push(x)}
    Object.assign(x,{subj:val('t-subj'),kind:val('t-kind'),date,topics:val('t-topics')});
    if(isNew&&document.getElementById('t-plan').classList.contains('on'))x.steps=makePlan(date);
    if(!isNew){const lab=val('t-grade'),old=S.grades.find(g=>g.testId===x.id);
      if(lab){const v=parseGrade(lab);if(v==null){toast('Voto non valido (es. 7+, 6½)');return}
        const g=old||{id:uid(),testId:x.id};if(!old)S.grades.push(g);
        Object.assign(g,{subj:x.subj,label:lab,value:v,kind:/Orale|Interrog/.test(x.kind)?'Orale':'Scritto',date:x.date,note:x.topics.slice(0,60)});
      }else if(old)S.grades=S.grades.filter(g=>g!==old);}
    save();closeModal();render()},
  tdel:el=>{if(!armed(el))return;S.tests=S.tests.filter(x=>x.id!==el.dataset.id);save();closeModal();render()},
  cell:el=>{const d=+el.dataset.d,i=+el.dataset.i,cur=(S.timetable[d]||[])[i];
    openModal(`<h3>${DAYS[d]} · ${S.slots[i]}</h3><div class="picks">${S.subjects.map(s=>`<button class="chip ${s.id===cur?'on':''}" data-act="setcell" data-d="${d}" data-i="${i}" data-s="${s.id}"><span class="dot" style="background:${s.color};display:inline-block;margin-right:6px;vertical-align:-1px"></span>${esc(s.name)}</button>`).join('')}<button class="chip" data-act="setcell" data-d="${d}" data-i="${i}" data-s="">— Vuota</button></div>`)},
  setcell:el=>{const d=+el.dataset.d,i=+el.dataset.i;S.timetable[d]=S.timetable[d]||[];S.timetable[d][i]=el.dataset.s;save();closeModal();render()},
  slot:el=>{const i=+el.dataset.i;openModal(`<h3>Orario della ${i+1}ª ora</h3><input id="sl" type="time" value="${S.slots[i].padStart(5,'0')}"><div class="mrow"><button class="btn" data-act="slotsave" data-i="${i}">Salva</button></div>`)},
  slotsave:el=>{const v=val('sl');if(v)S.slots[+el.dataset.i]=v.replace(/^0/,'');save();closeModal();render()},
  addslot:()=>{const l=S.slots[S.slots.length-1]||'7:00';const[h,m]=l.split(':').map(Number);S.slots.push((h+1)+':'+String(m||0).padStart(2,'0'));save();render()},
  rmslot:()=>{if(S.slots.length>1){S.slots.pop();Object.values(S.timetable).forEach(a=>a.length=Math.min(a.length,S.slots.length));save();render()}},
  sedit:el=>subjForm(byId(S.subjects,el.dataset.id)),
  snew:()=>subjForm(),
  pickc:el=>{document.querySelectorAll('#s-col .sw').forEach(s=>s.classList.toggle('on',s===el));document.getElementById('s-save').dataset.c=el.dataset.c},
  ssave:el=>{const name=val('s-name');if(!name){toast('Scrivi il nome');return}
    let s=byId(S.subjects,el.dataset.id);if(!s){s={id:el.dataset.id};S.subjects.push(s)}
    Object.assign(s,{name,color:el.dataset.c,items:lines(document.getElementById('s-items').value)});save();closeModal();render()},
  sdel:el=>{if(!armed(el))return;const id=el.dataset.id;S.subjects=S.subjects.filter(s=>s.id!==id);Object.values(S.timetable).forEach(a=>a.forEach((v,i)=>{if(v===id)a[i]=''}));save();closeModal();render()},
  zk:el=>{const tI=iso(nextSchool(today()));S.checks[tI]=S.checks[tI]||{};const k=el.dataset.k;S.checks[tI][k]=!S.checks[tI][k];save();render();checkZaino()},
  lists:()=>openModal(`<h3>Liste fisse</h3><label>✏️ Ogni giorno nello zaino</label><textarea id="l-f" rows="5">${esc(S.fixed.join('\n'))}</textarea><label>🌙 Prima di dormire</label><textarea id="l-e" rows="5">${esc(S.evening.join('\n'))}</textarea><div class="mrow"><button class="btn" data-act="listsave">Salva</button></div>`),
  listsave:()=>{S.fixed=lines(document.getElementById('l-f').value);S.evening=lines(document.getElementById('l-e').value);save();closeModal();render()},
  timer:el=>timerModal(el.dataset.label||''),
  tset:el=>{TIMER.total=TIMER.left=+el.dataset.n*60;timerModal()},
  tgo:()=>{if(TIMER.run){clearInterval(TIMER.iv);TIMER.run=false}else{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}TIMER.run=true;TIMER.iv=setInterval(tick,1000)}pill();timerModal()},
  tstop:()=>{clearInterval(TIMER.iv);TIMER.run=false;TIMER.left=TIMER.total;TIMER.label='';pill();closeModal()},
  per:el=>{F.per=el.dataset.v;render()},
  gnew:el=>gradeForm(null,el.dataset.s),
  gedit:el=>gradeForm(byId(S.grades,el.dataset.id)),
  gsub:el=>subGrades(el.dataset.id),
  gq:el=>{document.getElementById('g-val').value=el.dataset.v},
  gsave:el=>{const label=val('g-val'),v=parseGrade(label);if(v==null){toast('Voto non valido: usa numeri da 0 a 10 (es. 7+, 6½)');return}
    let g=byId(S.grades,el.dataset.id);const isNew=!g;if(!g){g={id:el.dataset.id};S.grades.push(g)}
    Object.assign(g,{subj:val('g-subj'),label,value:v,kind:val('g-kind'),date:val('g-date')||iso(today()),note:val('g-note')});
    save();closeModal();if(isNew&&v>=7){celebrate()}TAB='voti';render()},
  gdel:el=>{if(!armed(el))return;S.grades=S.grades.filter(x=>x.id!==el.dataset.id);save();closeModal();render()},
  starsinfo:()=>toast(`Hai ${S.stars} stelle ⭐ — le guadagni finendo compiti, ripassi, timer e lo zaino della sera`),
  settings:()=>openModal(`<h3>Impostazioni</h3>
    <label>Nome</label><input id="o-name" value="${esc(S.name)}">
    <label>Giorni di scuola</label><select id="o-days"><option value="5" ${S.days==5?'selected':''}>Lunedì – Venerdì</option><option value="6" ${S.days==6?'selected':''}>Lunedì – Sabato</option></select>
    <div class="mrow"><button class="btn" data-act="osave">Salva</button></div>
    <label style="margin-top:24px">💾 Copia di sicurezza</label>
    <div class="sub">I dati restano su questo dispositivo. Copia il codice e conservalo, oppure incollalo su un altro dispositivo.</div>
    <div class="mrow" style="margin-top:8px"><button class="btn ghost" data-act="exp">Copia codice</button></div>
    <textarea id="o-imp" rows="3" placeholder="Incolla qui un codice per importare" style="margin-top:8px"></textarea>
    <div class="mrow"><button class="btn ghost" data-act="imp">Importa</button></div>`),
  osave:()=>{S.name=val('o-name')||'Noemi';S.days=+val('o-days');save();closeModal();render()},
  exp:async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{await navigator.clipboard.writeText(code);toast('Codice copiato ✓')}catch(e){document.getElementById('o-imp').value=code;toast('Seleziona e copia il codice qui sotto')}},
  imp:()=>{try{const raw=val('o-imp');const o=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(o.subjects&&o.homework){S=Object.assign(defaults(),o)}else{o.rev=(S.seedRev||0)+1;applySeed(S,o)}
    save();closeModal();render();toast('Importato ✓')}catch(e){toast('Codice non valido')}}
};
function checkZaino(){const z=zainoStats(),tI=iso(nextSchool(today()));S.checks[tI]=S.checks[tI]||{};if(z.total&&z.pct===100&&!S.checks[tI].__done){S.checks[tI].__done=true;S.stars+=3;save();celebrate();toast('Zaino pronto! ⭐ +3 — buonanotte 🌙');render()}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});

// pulizia spunte vecchie
(()=>{const lim=iso(addDays(today(),-10));Object.keys(S.checks).forEach(k=>{if(k<lim)delete S.checks[k]});save()})();
render();
setInterval(()=>{if(TAB==='oggi'&&!M.classList.contains('open'))render()},60000);
</script>
</body>
</html>
