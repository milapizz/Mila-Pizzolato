<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda &amp; Diario</title>
  <meta name="description" content="Agenda per la scuola e la vita privata, risparmi e diario con allegati.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="tabs" id="tabs" aria-label="Sezioni">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Agenda &amp; Diario</span></div>
      <button data-tab="agenda" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Agenda</span>
      </button>
      <button data-tab="diario" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h11a2 2 0 0 1 2 2v15H7.5A2.5 2.5 0 0 1 5 18V4.5a1 1 0 0 1 1-1Z"/><path d="M5 18a2.5 2.5 0 0 1 2.5-2.5H19M9 8h6M9 11.5h4"/></svg>
        <span>Diario</span>
      </button>
      <button data-tab="budget" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13.5" rx="3"/><path d="M3 10.5h18M16 15h2"/></svg>
        <span>Budget</span>
      </button>
      <button data-tab="altro" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        <span>Altro</span>
      </button>
    </nav>

    <div class="content">
      <header class="topbar">
        <h1 id="title">Agenda</h1>
        <div class="seg" id="sphere" role="group" aria-label="Filtra per ambito">
          <button type="button" data-sphere="all">Tutto</button>
          <button type="button" data-sphere="lavoro"><i class="dot lavoro"></i>Scuola</button>
          <button type="button" data-sphere="famiglia"><i class="dot famiglia"></i>Vita privata</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>

    <button class="fab" id="fab" type="button" aria-label="Aggiungi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <dialog id="dlg" class="sheet"></dialog>
  <dialog id="viewer" class="viewer"></dialog>
  <dialog id="ask" class="ask"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>window.AGENDA_PRESET = 'studente';</script>
  <script src="app.js"></script>
</body>
</html>
